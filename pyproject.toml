[project]
name = "helpdesk-agents"
version = "0.1.0"
description = "One helpdesk, three agent patterns, three frameworks"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pydantic",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]